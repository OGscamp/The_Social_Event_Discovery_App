name: Frontend Quality

# Frontend-only quality gates: lint and Vitest coverage. Complements:
#   - node-build.yml      (frontend build smoke)
#   - backend-integration.yml (backend tests + coverage text-summary)
#   - db-validation.yml   (schema + FK validation)
#
# Coverage report is uploaded as a CI artifact so reviewers can pull
# the lcov + html files instead of needing to run vitest locally.

on:
  push:
  pull_request:

# Cancel an in-progress run when a new commit lands on the same branch.
# Saves Actions minutes and means the latest commit's status is what
# the PR shows.
concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend/eventconnect-web

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/eventconnect-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # First introduction of CI-gated lint to this repo. Several existing
      # files (Chat.tsx, EventDetails.tsx, Index.tsx, socket.ts) have
      # pre-existing `any` and prefer-const violations that aren't this
      # PR's responsibility to fix. Surface lint output as a PR signal
      # without blocking merges; flip to blocking once the existing
      # violations are cleaned up in a follow-up PR.
      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

  coverage:
    name: Vitest coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/eventconnect-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/eventconnect-web/coverage/
          retention-days: 14
